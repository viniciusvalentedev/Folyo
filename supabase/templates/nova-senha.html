<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #0B0B12;">
  <p style="font-size: 22px; font-weight: bold; margin: 0 0 24px; color: #2D24C8;">Folyo</p>
  <h1 style="font-size: 24px; margin: 0 0 12px;">Criar uma senha nova</h1>
  <p style="font-size: 15px; line-height: 1.6; margin: 0 0 24px;">
    Recebemos um pedido para trocar a senha da sua conta na Folyo. Clique no botão abaixo para escolher uma senha nova.
    O link vale por 1 hora e só funciona uma vez.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #B81CAB; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 15px; padding: 14px 24px; border-radius: 10px;">
      Criar senha nova
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.6; color: #5D5B72; margin: 0;">
    Não pediu isso? Pode ignorar este e-mail: sua senha continua a mesma.
  </p>
</div>
