  --ink: #0B0B12; --ink-2: #12121B; --ink-3: #1A1A26; --ink-4: #252534;

  --blue: #2D24C8; --blue-2: #241CA6; --blue-soft: #E9E8FC; --blue-on-dark: #ABA6FF;
  --magenta: #DD33CF; --magenta-deep: #B81CAB; --magenta-soft: #FBE6F9;
  --lime: #C9E23F; --lime-2: #D8EE5C; --lime-ink: #4E6100; --lime-soft: #F1F8CF;
  --warn: #F2A93B; --warn-ink: #875000; --warn-soft: #FDF1DC;
  --err: #FF6B84; --err-ink: #B8173A; --err-soft: #FDE7EC;
  --art-paper: #E7E5F6;
  --f-display: 'Poppins', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-ui: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-s: 8px; --r-m: 12px; --r-l: 18px; --r-xl: 24px;
  --ease: cubic-bezier(.2, .7, .2, 1); --t: 260ms;
  --side: 248px;
  color-scheme: dark;
  --bg: var(--ink); --fg: #F3F2F8; --mute: #9E9CB2; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
  --card: var(--ink-2); --card-2: var(--ink-3); --hover: rgba(255,255,255,.045); --link: var(--blue-on-dark);

  --ok-ink: var(--lime); --ok-soft: rgba(201,226,63,.12); --prog-ink: var(--blue-on-dark); --prog-soft: rgba(171,166,255,.12);
  --warn-c: var(--warn); --warn-bg: rgba(242,169,59,.12); --err-c: var(--err); --err-bg: rgba(255,107,132,.12);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset;
}
.surface-ink, .sidebar, .topbar, .mobilenav, .drawer{
  --bg: var(--ink); --fg: #F3F2F8; --mute: #9E9CB2; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
  --card: var(--ink-2); --card-2: var(--ink-3); --hover: rgba(255,255,255,.045); --link: var(--blue-on-dark);
  --ring-track: rgba(255,255,255,.1); --input: var(--ink-3); --focus: var(--blue-on-dark);
  --ok-ink: var(--lime); --ok-soft: rgba(201,226,63,.12); --prog-ink: var(--blue-on-dark); --prog-soft: rgba(171,166,255,.12);
  --warn-c: var(--warn); --warn-bg: rgba(242,169,59,.12); --err-c: var(--err); --err-bg: rgba(255,107,132,.12);
  --shadow: none;
  color-scheme: dark;
}
.surface-paper{
  --bg: var(--paper); --fg: var(--ink); --mute: #5D5B72; --line: #E2E0EC; --line-2: #CFCCE0;
  --card: #FFFFFF; --card-2: var(--paper-3); --hover: rgba(45,36,200,.045); --link: var(--blue);
  --ring-track: #E4E2F0; --input: #FFFFFF; --focus: var(--blue);
  --ok-ink: var(--lime-ink); --ok-soft: var(--lime-soft); --prog-ink: var(--blue); --prog-soft: var(--blue-soft);
  --warn-c: var(--warn-ink); --warn-bg: var(--warn-soft); --err-c: var(--err-ink); --err-bg: var(--err-soft);
  --shadow: 0 1px 2px rgba(11,11,18,.05), 0 8px 24px -14px rgba(11,11,18,.18);
  color-scheme: light;
}

*, *::before, *::after{ box-sizing: border-box; }
html, body{ background: var(--ink); color: #F3F2F8; }
body{ margin: 0; font: 400 15px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before{ content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
#root{ min-height: 100%; }
h1, h2, h3, h4{ font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -0.015em; text-wrap: balance; color: var(--fg); }
p{ margin: 0; }
a{ color: var(--link); text-decoration: none; }
a:hover{ text-decoration: underline; text-underline-offset: 3px; }
button{ font: inherit; color: inherit; cursor: pointer; }
button:disabled{ cursor: not-allowed; }
input, textarea, select{ font: inherit; color: inherit; }
:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
img, svg{ max-width: 100%; }
.sr-only{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip{ position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--lime); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-weight: 600; }
.skip:focus{ top: calc(12px + env(safe-area-inset-top, 0px)); }
.ico{ flex: none; }
.mono{ font-family: var(--f-mono); }
.muted{ color: var(--mute); }
.muted-on-dark{ color: #A6A4BA; }
.muted-on-blue{ color: rgba(255,255,255,.72); }
.small{ font-size: 13px; }
.row{ display: flex; align-items: center; }
.gap-s{ gap: 10px; }
.wrap{ flex-wrap: wrap; }
.w-full{ width: 100%; justify-content: center; }
.stack{ display: grid; gap: 16px; }
.hl{ color: var(--lime); font-weight: 600; }

/* ---------- Tipografia ---------- */
.eyebrow{ font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
.eyebrow.cap::first-letter{ text-transform: uppercase; }
.eyebrow.on-blue{ color: rgba(255,255,255,.75); }
.display{ font-size: clamp(32px, 4.2vw, 52px); line-height: 1.04; font-weight: 600; letter-spacing: -0.03em; }
.display-xl{ font-size: clamp(36px, 5.6vw, 72px); line-height: 1; font-weight: 600; letter-spacing: -0.035em; }
.lead{ font-size: 17px; color: var(--mute); max-width: 62ch; margin-top: 10px; }
.h-sec{ font-size: 20px; margin-bottom: 14px; }
.u-mark{ position: relative; white-space: nowrap; color: var(--blue); }
.u-mark::after{ content: ""; position: absolute; left: 0; right: 0; bottom: .02em; height: .14em; background: var(--lime); border-radius: 99px; z-index: -1; transform-origin: left; animation: markIn .8s .25s var(--ease) both; }
.section-head{ display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head h2{ font-size: 20px; }
.section-head .h-sec{ margin-bottom: 0; }
.link-sm{ display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; }
.link-btn{ background: none; border: 0; padding: 0; color: var(--link); font-size: 14px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.link-btn:hover{ text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger{ color: var(--err-c); }
.link-btn.on{ color: var(--ok-ink); }

/* ---------- Estrutura ---------- */
.app{ display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; background: var(--ink); transition: grid-template-columns var(--t) var(--ease); }
.app.in-class{ grid-template-columns: 76px minmax(0, 1fr); }
.app-main{ min-width: 0; display: flex; flex-direction: column; }
main{ flex: 1; outline: none; min-width: 0; }
.route{ animation: routeIn .38s var(--ease) both; min-height: 100%; }

.sidebar{ position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--ink); color: var(--fg); padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 16px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid rgba(255,255,255,.06); }
.brand{ display: flex; align-items: center; gap: 10px; color: #fff; padding: 4px 10px 14px; }
.brand:hover{ text-decoration: none; }
.brand-word{ font: 600 21px/1 var(--f-display); letter-spacing: -0.02em; color: #fff; }
.mark, .wordmark{ display: block; flex: none; overflow: visible; }
.brand .brand-compact{ display: none; }
.sidebar.compact .brand-full{ display: none; }
.sidebar.compact .brand-compact{ display: block; }
.brand .wordmark{ transition: transform var(--t) var(--ease); transform-origin: left center; }
.brand:hover .wordmark{ transform: rotate(-2deg); }
.nav-group{ display: grid; gap: 2px; margin-bottom: 10px; }
.nav-label{ font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: #6F6D85; padding: 10px 12px 6px; }
.nav-item{ display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #C9C7DA; font-weight: 500; font-size: 14.5px; position: relative; transition: background var(--t), color var(--t); }
.nav-item:hover{ background: rgba(255,255,255,.05); color: #fff; text-decoration: none; }
.nav-item.on{ background: rgba(255,255,255,.08); color: #fff; }
.nav-item.on::before{ content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--magenta); }
.nav-item.on .ico{ color: var(--magenta); }
.nav-badge{ margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: rgba(255,255,255,.08); font: 600 11px/20px var(--f-ui); font-style: normal; text-align: center; color: #D7D5E6; }
.sidebar-foot{ margin-top: auto; display: grid; gap: 6px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 12px; }
.usermenu{ position: relative; }
.user-chip{ width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: none; border: 0; text-align: left; }
.user-chip:hover{ background: rgba(255,255,255,.05); }
.user-meta{ display: grid; min-width: 0; flex: 1; }
.user-meta b{ font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-meta small{ font-size: 12px; color: #8D8BA3; }
.menu{ position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; min-width: 210px; background: var(--ink-3); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 6px; display: grid; z-index: 30; animation: popIn .18s var(--ease); box-shadow: 0 18px 40px -16px rgba(0,0,0,.6); }
.menu button{ display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 9px 10px; border-radius: 8px; text-align: left; font-size: 14px; color: #E7E6F0; }
.menu button:hover{ background: rgba(255,255,255,.06); }
.menu hr{ border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 0; width: 100%; }
.sidebar.compact{ padding-left: 12px; padding-right: 12px; align-items: center; }
.sidebar.compact .nav-text, .sidebar.compact .nav-label, .sidebar.compact .nav-badge, .sidebar.compact .brand-word{ display: none; }
.sidebar.compact .nav-item{ width: 44px; justify-content: center; padding: 0; }
.sidebar.compact .nav-item.on::before{ left: -12px; }
.sidebar.compact .brand{ padding: 4px 0 14px; justify-content: center; }
.sidebar.compact .nav-group{ margin-bottom: 4px; }
.sidebar.compact .menu{ left: 0; right: auto; }

.topbar{ position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: 64px; display: flex; align-items: center; gap: 16px; background: rgba(11,11,18,.92); backdrop-filter: blur(10px); color: var(--fg); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar-right{ margin-left: auto; display: flex; align-items: center; gap: 8px; }
.gsearch{ position: relative; min-width: 0; display: flex; align-items: center; gap: 10px; flex: 1; max-width: 520px; height: 40px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); color: #A6A4BA; transition: border-color var(--t), background var(--t); }
.gsearch:focus-within{ border-color: rgba(171,166,255,.5); background: rgba(255,255,255,.07); }
.gsearch input{ flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: none; color: #fff; font-size: 14px; }
.gsearch input::placeholder{ color: #807E97; }
kbd{ font: 500 11px/1 var(--f-mono); color: #8D8BA3; border: 1px solid rgba(255,255,255,.12); padding: 4px 6px; border-radius: 6px; }
.gsearch-pop{ position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--ink-3); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 6px; display: grid; z-index: 50; animation: popIn .18s var(--ease); box-shadow: 0 24px 48px -20px rgba(0,0,0,.7); }
.gsearch-pop button{ display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 0; background: none; text-align: left; color: #E7E6F0; font-size: 14px; }
.gsearch-pop button span{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gsearch-pop button em{ font: 500 11px var(--f-mono); font-style: normal; color: #8D8BA3; text-transform: uppercase; letter-spacing: .06em; }
.gsearch-pop button.on{ background: rgba(255,255,255,.07); }
.gsearch-empty{ padding: 12px; color: #A6A4BA; font-size: 14px; }
.notif{ position: relative; }
.notif .dot{ position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 0 2px var(--ink); }
.notif-pop{ position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); background: var(--ink-3); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 8px; z-index: 50; animation: popIn .18s var(--ease); box-shadow: 0 24px 48px -20px rgba(0,0,0,.7); }
.notif-pop header{ display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 10px; font-size: 14px; color: #fff; }
.notif-item{ width: 100%; display: grid; gap: 2px; text-align: left; padding: 10px 10px 10px 22px; border: 0; background: none; border-radius: 10px; font-size: 14px; color: #C9C7DA; position: relative; }
.notif-item:hover{ background: rgba(255,255,255,.05); }
.notif-item small{ color: #8D8BA3; font-size: 12px; }
.notif-item.unread{ color: #fff; }
.notif-item.unread::before{ content: ""; position: absolute; left: 9px; top: 17px; width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); }
.pad{ padding: 12px; }

.page{ min-height: calc(100vh - 64px); background: var(--bg); color: var(--fg); padding-block: 36px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page > *{ max-width: 1240px; margin-left: auto; margin-right: auto; }
.page.surface-paper{ border-top-left-radius: 22px; }
.app.in-class .page{ border-radius: 0; }

/* ---------- Botões ---------- */
.btn{ display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 11px; border: 1px solid transparent; font: 600 14px/1 var(--f-ui); letter-spacing: -0.005em; white-space: nowrap; transition: background var(--t), border-color var(--t), color var(--t), transform .12s var(--ease); }
.btn:active:not(:disabled){ transform: translateY(1px) scale(.99); }
.btn:disabled{ opacity: .45; }
.btn-sm{ height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; gap: 6px; }
.btn-lg{ height: 50px; padding: 0 22px; font-size: 15px; }
.btn-primary{ background: var(--magenta-deep); color: #fff; }
.btn-primary:hover:not(:disabled){ background: #A3159A; }
.btn-go{ background: var(--lime); color: var(--ink); }
.btn-go:hover:not(:disabled){ background: var(--lime-2); }
.btn-quiet{ background: var(--card); color: var(--fg); border-color: var(--line-2); }
.btn-quiet:hover:not(:disabled){ border-color: var(--fg); }
.btn-quiet-dark{ background: rgba(255,255,255,.06); color: #fff; border-color: rgba(255,255,255,.12); }
.btn-quiet-dark:hover:not(:disabled){ background: rgba(255,255,255,.1); }
.btn-ghost{ background: transparent; color: var(--fg); }
.btn-ghost:hover:not(:disabled){ background: var(--hover); }
.btn-ghost-on-blue, .btn-ghost-on-dark{ background: transparent; color: #fff; border-color: rgba(255,255,255,.34); }
.btn-ghost-on-blue:hover, .btn-ghost-on-dark:hover{ background: rgba(255,255,255,.1); border-color: #fff; }
.btn-danger{ background: var(--err-ink); color: #fff; }
.btn-danger:hover{ background: #9C1030; }
.btn-done{ background: rgba(201,226,63,.12); color: var(--lime); border-color: rgba(201,226,63,.42); }
.btn.pop .ico{ animation: checkPop .5s var(--ease); }
.btn.loading{ pointer-events: none; }
.spinner{ width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
.icon-btn{ width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: inherit; position: relative; transition: background var(--t), color var(--t); flex: none; }
.icon-btn:hover:not(:disabled){ background: var(--hover); }
.icon-btn:disabled{ opacity: .35; }
.icon-btn.on{ color: var(--lime); }

/* ---------- Indicadores ---------- */
.progress{ height: 6px; border-radius: 99px; background: var(--ring-track); overflow: hidden; width: 100%; }
.progress-sm{ height: 4px; }
.progress-lg{ height: 8px; }
.progress span{ display: block; height: 100%; border-radius: inherit; background: var(--lime); transition: width .8s var(--ease); }
.progress.tone-blue span{ background: var(--blue); }
.surface-ink .progress.tone-blue span{ background: var(--blue-on-dark); }
.progress.tone-magenta span{ background: var(--magenta); }
.surface-paper .progress.tone-lime span{ background: var(--lime-ink); }
.surface-paper .ccard .progress.tone-lime span, .surface-paper .crow .progress.tone-lime span{ background: var(--blue); }
.ring{ position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg{ display: block; }
.ring-arc{ transition: stroke-dashoffset 1s var(--ease); }
.ring-in{ position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-in b{ font: 600 20px/1 var(--f-display); }
.ring-in small{ font-size: 12px; color: var(--mute); }
.ring-big{ font-size: 30px !important; }
.ring-big-sm{ font-size: 20px !important; }
.ring-sm{ font-size: 13px !important; }
.countup{ font-variant-numeric: tabular-nums; display: inline-block; transition: color .4s; }
.countup.flash{ color: var(--lime); }
.surface-paper .countup.flash{ color: var(--magenta-deep); }










.pill{ display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font: 500 12px/1 var(--f-ui); white-space: nowrap; }
.pill-ok{ background: var(--ok-soft); color: var(--ok-ink); }
.pill-progress{ background: var(--prog-soft); color: var(--prog-ink); }
.pill-warn{ background: var(--warn-bg); color: var(--warn-c); }
.pill-neutral{ background: var(--card-2); color: var(--mute); }
.pill-blue{ background: var(--blue-soft); color: var(--blue); }
.surface-ink .pill-blue{ background: rgba(171,166,255,.14); color: var(--blue-on-dark); }
.pill-spacer{ width: 98px; }

/* ---------- Controles ---------- */
.seg{ display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button{ display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; background: none; border-radius: 8px; color: var(--mute); font-size: 14px; font-weight: 500; transition: background var(--t), color var(--t); }
.seg button:hover{ color: var(--fg); }
.seg button.on{ background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(11,11,18,.1), 0 0 0 1px var(--line); }
.surface-ink .seg button.on{ background: var(--ink-4); box-shadow: none; }
.seg button i{ font-style: normal; font: 600 11px/18px var(--f-ui); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--magenta-deep); color: #fff; }
.seg-sm button{ height: 30px; font-size: 13px; padding: 0 10px; }
.tabs{ display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar{ display: none; }
.tabs button{ display: inline-flex; align-items: center; gap: 7px; padding: 12px 12px; border: 0; background: none; color: var(--mute); font-weight: 500; font-size: 14px; white-space: nowrap; position: relative; }
.tabs button:hover{ color: var(--fg); }
.tabs button.on{ color: var(--fg); }
.tabs button.on::after{ content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--magenta); animation: growX .3s var(--ease); }
.tab-badge{ font-style: normal; font: 600 11px/18px var(--f-ui); padding: 0 6px; border-radius: 99px; background: var(--card-2); color: var(--mute); }
.toggle{ display: flex; align-items: center; gap: 14px; justify-content: space-between; cursor: pointer; position: relative; }
.toggle input{ position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-text{ display: grid; gap: 2px; }
.toggle-text b{ font-weight: 500; font-size: 14px; }
.toggle-text small{ color: var(--mute); font-size: 13px; }
.toggle-ui{ width: 38px; height: 22px; border-radius: 99px; background: var(--line-2); position: relative; transition: background var(--t); flex: none; }
.toggle-ui::after{ content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform var(--t) var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked + .toggle-ui{ background: var(--blue); }
.surface-ink .toggle input:checked + .toggle-ui{ background: var(--lime); }
.surface-ink .toggle input:checked + .toggle-ui::after{ background: var(--ink); }
.toggle input:checked + .toggle-ui::after{ transform: translateX(16px); }
.toggle input:focus-visible + .toggle-ui{ outline: 2px solid var(--focus); outline-offset: 2px; }
.field{ display: grid; gap: 6px; min-width: 0; }
.field > label{ font-size: 13px; font-weight: 600; color: var(--fg); }
.field > small{ font-size: 12.5px; color: var(--mute); }
.field-error{ color: var(--err-c) !important; display: flex; gap: 5px; align-items: center; }
.field.has-error .inp, .field.has-error .ta, .field.has-error .chipinput-box{ border-color: var(--err-c); }
.inp, .ta, .select select{ width: 100%; background: var(--input); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; color: var(--fg); outline: none; transition: border-color var(--t), box-shadow var(--t); }
.inp{ height: 42px; }
.ta{ resize: vertical; line-height: 1.5; min-height: 64px; }
.ta-sm{ min-height: 52px; font-size: 14px; }
.inp:focus, .ta:focus, .select select:focus{ border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.inp::placeholder, .ta::placeholder{ color: color-mix(in srgb, var(--mute) 80%, transparent); }
.select{ position: relative; display: inline-flex; min-width: 0; }
.select select{ appearance: none; height: 38px; padding: 0 34px 0 12px; font-size: 14px; cursor: pointer; }
.select .ico{ position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--mute); }
.chipinput{ display: grid; gap: 8px; }
.chipinput-box{ display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; min-height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--input); }
.chipinput-box:focus-within{ border-color: var(--focus); }
.chipinput-box input{ flex: 1; min-width: 120px; border: 0; outline: 0; background: none; padding: 4px 6px; font-size: 14px; }
.chip{ display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px 0 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 500; }
.surface-ink .chip{ background: rgba(171,166,255,.14); color: var(--blue-on-dark); }
.chip button{ border: 0; background: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: inherit; }
.chip button:hover{ background: rgba(45,36,200,.12); }
.chipinput-sugg{ display: flex; flex-wrap: wrap; gap: 6px; }
.chipinput-sugg button{ display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 99px; border: 1px dashed var(--line-2); background: none; font-size: 12.5px; color: var(--mute); }
.chipinput-sugg button:hover{ color: var(--fg); border-color: var(--fg); }
.chips{ display: flex; flex-wrap: wrap; gap: 6px; }
.chip-static{ display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--card-2); color: var(--fg); font-size: 13px; font-weight: 500; }
.chip-static.link:hover{ background: var(--blue-soft); color: var(--blue); text-decoration: none; }
.chip-dark{ display: inline-flex; height: 26px; align-items: center; padding: 0 9px; border-radius: 7px; background: rgba(255,255,255,.07); color: #D7D5E6; font-size: 12.5px; }
.chips-mini{ display: flex; flex-wrap: wrap; gap: 5px; }
.chips-mini span{ font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--card-2); color: var(--mute); }
.chip-toggle{ display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); color: var(--mute); font-size: 13px; font-weight: 500; transition: all var(--t); }
.chip-toggle:hover{ color: var(--fg); border-color: var(--fg); }
.chip-toggle.on{ background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.surface-ink .chip-toggle{ background: transparent; }
.surface-ink .chip-toggle.on{ background: rgba(201,226,63,.12); color: var(--lime); }
.check{ position: relative; display: inline-grid; flex: none; cursor: pointer; }
.check input{ position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.check-ui{ width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; transition: all var(--t) var(--ease); background: var(--input); }
.check input:checked + .check-ui{ background: var(--blue); border-color: var(--blue); color: #fff; }
.check input:checked + .check-ui .ico{ animation: checkPop .4s var(--ease); }
.check input:focus-visible + .check-ui{ outline: 2px solid var(--focus); outline-offset: 2px; }
.fav{ width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 0; background: rgba(11,11,18,.4); color: #fff; backdrop-filter: blur(6px); transition: background var(--t), color var(--t), transform .2s var(--ease); }
.fav:hover{ background: rgba(11,11,18,.6); }
.fav.on{ color: var(--magenta); background: #fff; }
.fav.on .ico{ fill: currentColor; }
.fav.light{ background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); width: 42px; height: 42px; }
.fav:active{ transform: scale(.9); }
.tip{ position: relative; display: inline-flex; }
.tip-bubble{ position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 4px); background: var(--ink); color: #fff; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; width: max-content; max-width: 240px; opacity: 0; pointer-events: none; transition: all .18s var(--ease); z-index: 20; }
.tip:hover .tip-bubble, .tip:focus .tip-bubble{ opacity: 1; transform: translate(-50%, 0); }
.demo-tag{ display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font: 500 11px/1 var(--f-mono); letter-spacing: .03em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn-c); }
.alert{ display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; font-size: 14px; align-items: flex-start; margin-bottom: 18px; }
.alert ul{ margin: 6px 0 0; padding-left: 18px; }
.alert-err{ background: var(--err-bg); color: var(--err-c); }
.alert-err b, .alert-err li{ color: var(--fg); }
.alert-warn{ background: var(--warn-bg); color: var(--fg); }
.alert-warn .ico{ color: var(--warn-c); }
.alert-info{ background: var(--prog-soft); color: var(--fg); }
.alert-info .ico{ color: var(--prog-ink); }
.empty{ text-align: center; padding: 48px 20px; display: grid; justify-items: center; gap: 8px; max-width: 460px; margin: 0 auto; }
.empty-mark{ width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--card-2); color: var(--mute); margin-bottom: 6px; }
.empty h3{ font-size: 18px; }
.empty p{ color: var(--mute); font-size: 14.5px; margin-bottom: 8px; }
.skel{ display: block; border-radius: 6px; background: linear-gradient(90deg, var(--card-2), var(--line), var(--card-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }

/* ---------- Modal e toasts ---------- */
.modal-scrim{ position: fixed; inset: 0; z-index: 80; background: rgba(6,6,12,.62); backdrop-filter: blur(4px); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadeIn .2s ease; }
.modal{ width: 100%; max-height: calc(100vh - 48px); overflow: auto; background: var(--bg); color: var(--fg); border-radius: 20px; border: 1px solid var(--line); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); animation: modalIn .32s var(--ease); outline: none; display: flex; flex-direction: column; }
.modal.surface-paper{ background: #fff; }
.modal.surface-ink{ background: var(--ink-2); }
.modal-sm{ max-width: 440px; } .modal-md{ max-width: 560px; } .modal-lg{ max-width: 820px; }
.modal-head{ display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 22px 22px 6px 24px; }
.modal-head h2{ font-size: 20px; }
.modal-head .eyebrow{ margin-bottom: 4px; }
.modal-body{ padding: 12px 24px 20px; }
.modal-foot{ display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; bottom: 0; background: inherit; }
.toasts{ position: fixed; z-index: 90; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; width: min(400px, calc(100vw - 32px)); }
.toast{ display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-radius: 14px; background: #1D1D2B; color: #F3F2F8; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 48px -18px rgba(0,0,0,.6); animation: toastIn .38s var(--ease); font-size: 14px; }
.toast-dot{ width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--lime); color: var(--ink); }
.toast-err .toast-dot{ background: var(--err); color: var(--ink); }
.toast-info .toast-dot{ background: var(--blue-on-dark); color: var(--ink); }
.toast-text{ flex: 1; display: grid; min-width: 0; }
.toast-text b{ font-weight: 600; }
.toast-act{ border: 0; background: none; color: var(--lime); font-weight: 600; font-size: 13.5px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
.toast-act:hover{ background: rgba(255,255,255,.06); }
.toast .icon-btn{ width: 30px; height: 30px; color: #8D8BA3; }

/* ---------- Arte ---------- */
.art{ position: relative; overflow: hidden; display: block; width: 100%; max-width: 100%; isolation: isolate; }
.art-svg{ position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; transition: transform .8s var(--ease); }
.art-glyph{ position: absolute; left: 7%; bottom: 2%; font: 600 clamp(56px, 7vw, 92px)/1 var(--f-display); letter-spacing: -0.06em; opacity: .95; }
.art-glyph.big{ font-size: clamp(80px, 11vw, 160px); }
.avatar{ display: inline-grid; place-items: center; border-radius: 50%; background: var(--magenta); color: var(--ink); font-family: var(--f-display); font-weight: 600; flex: none; letter-spacing: -0.02em; }
.avatar-ring{ box-shadow: 0 0 0 4px var(--blue), 0 0 0 6px var(--lime); }

/* ---------- Painéis compartilhados ---------- */
.pagehead{ margin-bottom: 28px; }
.pagehead h1{ font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -0.03em; line-height: 1.08; }
.pagehead-row{ display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.pagehead-text{ min-width: 0; flex: 1 1 420px; }
.pagehead-actions{ display: flex; gap: 10px; flex-wrap: wrap; }
.backlink{ display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--mute); font-size: 14px; font-weight: 500; padding: 6px 8px 6px 0; margin-bottom: 14px; }
.backlink:hover{ color: var(--fg); }
.backlink.on-dark{ color: rgba(255,255,255,.75); }
.backlink.on-dark:hover{ color: #fff; }
.panel{ background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 24px; }
.panel-head{ margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.panel-head h2{ font-size: 19px; margin-bottom: 4px; }
.panel-head .muted, .panel-head .muted-on-dark{ font-size: 14px; }
.grid-2{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.grid-cards{ display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
.side-card{ background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; display: grid; gap: 12px; align-content: start; }
.side-card.accent{ background: var(--blue); color: #fff; border-color: transparent; }
.side-card.accent .eyebrow{ color: rgba(255,255,255,.75); }
.side-card.accent .chip-static{ background: rgba(255,255,255,.14); color: #fff; }
.side-card.accent .btn-primary{ background: var(--lime); color: var(--ink); justify-self: start; }

/* ---------- Início ---------- */
.dash > * + *{ margin-top: 28px; }
.dash-top{ display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.dash-top .lead{ color: #B9B7CB; }








.lesson-num{ font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.14); }













.crow{ display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; padding: 10px 16px 10px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); transition: background var(--t), border-color var(--t); }
.crow:hover{ border-color: var(--line-2); background: var(--hover); }
.crow-art{ width: 56px !important; flex: none; border-radius: 10px; }
.crow-art .art-glyph{ font-size: 24px; left: 10%; bottom: 4%; }
.crow-text{ flex: 1; display: grid; gap: 5px; min-width: 0; }
.crow-text b{ font-weight: 600; font-size: 15px; }
.crow-text small{ color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow-pct{ font: 600 16px var(--f-display); font-variant-numeric: tabular-nums; }














.stage{ font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; justify-self: start; }



.career{ display: grid; align-content: start; gap: 18px; }
.career .panel-head{ margin-bottom: 0; }


















.career .btn{ justify-self: start; }

/* ---------- Cards de curso ---------- */
.ccard{ display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform .35s var(--ease), border-color var(--t), box-shadow .35s var(--ease); min-width: 0; }
.ccard:hover{ transform: translateY(-3px); border-color: var(--line-2); box-shadow: 0 22px 40px -28px rgba(11,11,18,.45); }
.ccard:hover .art-svg{ transform: scale(1.06) rotate(-2deg); }
.ccard-art{ position: relative; }
.ccard-top{ position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; }
.plan{ font: 600 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; background: rgba(11,11,18,.55); color: #fff; backdrop-filter: blur(6px); }
.plan.free{ background: var(--lime); color: var(--ink); }
.ccard-prog{ position: absolute; left: 0; right: 0; bottom: 0; }
.ccard-prog .progress{ border-radius: 0; background: rgba(11,11,18,.25); height: 5px; }
.ccard-prog .progress span{ border-radius: 0; background: var(--lime) !important; }
.ccard-body{ display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 18px; flex: 1; }
.ccard-cat{ font: 500 11.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--mute); }
.ccard h3{ font-size: 18px; line-height: 1.22; }
.ccard h3 a{ color: var(--fg); }
.ccard h3 a:hover{ text-decoration: none; }
.ccard-meta{ font-size: 13px; color: var(--mute); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ccard-meta b{ font-weight: 400; opacity: .5; }
.ccard-make{ display: grid; grid-template-columns: auto 1fr; column-gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--card-2); font-size: 13.5px; line-height: 1.35; margin-top: 2px; }
.ccard-spark{ color: var(--magenta); grid-row: span 2; margin-top: 3px; }
.ccard-make-k{ font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
.ccard-foot{ margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- Cards de projeto ---------- */
.pcard{ display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform .35s var(--ease), border-color var(--t), box-shadow .35s var(--ease); min-width: 0; }
.pcard:hover{ transform: translateY(-3px); border-color: var(--line-2); box-shadow: 0 22px 40px -28px rgba(0,0,0,.45); }
.pcard:hover .art-svg{ transform: scale(1.06); }
.pcard-art{ aspect-ratio: 16 / 9 !important; }
.pcard-title-on-art{ position: absolute; left: 18px; right: 30%; bottom: 16px; font: 600 clamp(18px, 1.9vw, 24px)/1.08 var(--f-display); letter-spacing: -0.025em; text-wrap: balance; }
.pcard-body{ padding: 16px 18px 18px; display: grid; gap: 8px; }
.pcard-tags{ display: flex; gap: 6px; flex-wrap: wrap; }
.pcard h3{ font-size: 16.5px; line-height: 1.3; }
.pcard h3 a{ color: var(--fg); }
.pcard-src{ font-size: 13px; color: var(--mute); }
.pcard-steps{ display: flex; align-items: center; gap: 10px; }
.pcard-steps small{ font-size: 12.5px; color: var(--mute); white-space: nowrap; }

/* ---------- Explorar ---------- */
.explore > * + *{ margin-top: 26px; }
.explore-head{ padding: 12px 0 4px; }
.explore-head h1{ max-width: 15ch; position: relative; z-index: 0; }
.explore-search{ margin-top: 26px; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 12px 0 20px; background: #fff; border: 1px solid var(--line-2); border-radius: 16px; max-width: 760px; color: var(--mute); transition: border-color var(--t), box-shadow var(--t); }
.explore-search:focus-within{ border-color: var(--blue); box-shadow: 0 0 0 4px rgba(45,36,200,.12); }
.explore-search input{ flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--fg); }
.cat-rail{ display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.cat-chip{ display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--fg); transition: all var(--t); }
.cat-chip i{ font-style: normal; font: 500 11.5px var(--f-mono); color: var(--mute); }
.cat-chip:hover{ border-color: var(--line-2); }
.cat-chip.on{ background: var(--ink); color: #fff; border-color: var(--ink); }
.cat-chip.on i{ color: var(--lime); }
.cat-chip.soon{ color: var(--mute); }
.filters{ display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.filter-fav{ display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--card); font-size: 14px; color: var(--fg); }
.filter-fav i{ font-style: normal; font-size: 12px; color: var(--mute); }
.filter-fav.on{ background: var(--magenta-soft); border-color: transparent; color: var(--magenta-deep); }
.filter-fav.on .ico{ fill: currentColor; }

.feature{ display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); border-radius: 26px; overflow: hidden; background: var(--ink); color: #fff; cursor: pointer; min-height: 340px; }
.feature-art{ height: 100%; min-height: 240px; }
.feature-art .art-glyph{ color: var(--lime); }
.feature:hover .art-svg{ transform: scale(1.05); }
.feature-body{ padding: 36px 40px; display: grid; gap: 14px; align-content: center; }
.feature-body h2{ color: #fff; font-size: clamp(26px, 3vw, 38px); line-height: 1.06; }
.feature-body p{ color: #C9C7DA; max-width: 52ch; }
.feature-body .eyebrow{ color: var(--lime); }
.feature-meta{ display: grid; grid-template-columns: auto auto 1fr; gap: 18px; margin: 4px 0 6px; }
.feature-meta dt{ font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: #8D8BA3; margin-bottom: 4px; }
.feature-meta dd{ margin: 0; font-size: 14px; color: #fff; }
.explore-sec{ padding-top: 10px; }
.area-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.area-tile{ display: grid; gap: 6px; text-align: left; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--fg); transition: all .3s var(--ease); }
.area-tile .ico{ color: var(--blue); margin-bottom: 8px; }
.area-tile b{ font-weight: 600; font-size: 15px; line-height: 1.3; }
.area-tile small{ color: var(--mute); font-size: 13px; }
.area-tile:hover{ border-color: var(--blue); transform: translateY(-2px); }

/* ---------- Página do curso ---------- */
.course-page{ padding: 0 !important; }
.course-page > *{ max-width: none; }
.course-hero{ color: #fff; position: relative; overflow: hidden; isolation: isolate; }
.course-hero.tone-blue{ background: var(--blue); }
.course-hero.tone-ink{ background: var(--ink-3); }
.course-hero.tone-magenta{ background: #7E1676; }
.course-hero.tone-lime{ background: #2A320A; }
.course-hero.tone-paper{ background: var(--blue-2); }
.course-hero::after{ content: ""; position: absolute; width: 460px; height: 646px; right: -60px; top: -200px; transform: rotate(-8deg); background: currentColor; color: rgba(255,255,255,.06); -webkit-mask: var(--mark-mask) center / contain no-repeat; mask: var(--mark-mask) center / contain no-repeat; z-index: -1; pointer-events: none; }
.course-hero-in{ max-width: 1240px; margin: 0 auto; padding-block: 28px 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.course-hero h1{ color: #fff; max-width: 18ch; }
.course-hero .eyebrow{ color: rgba(255,255,255,.72); }
.course-hero .lead{ color: rgba(255,255,255,.82); }
.course-hero-grid{ display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: end; }
.course-hero-grid > div:first-child{ display: grid; gap: 14px; }
.course-facts{ list-style: none; padding: 0; margin: 6px 0 8px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: rgba(255,255,255,.88); }
.course-facts li{ display: flex; align-items: center; gap: 7px; }
.course-hero-side{ display: grid; justify-items: center; gap: 10px; text-align: center; }
.course-hero-side .ring-in small{ color: rgba(255,255,255,.7); }
.course-hero-side .ring-in b{ color: #fff; }
.course-body{ background: var(--bg); color: var(--fg); padding-block: 40px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.course-cols{ max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; align-items: start; }
.course-main{ display: grid; gap: 40px; min-width: 0; }
.outcomes{ list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.outcomes li{ display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
.oc-n{ font: 600 13px/24px var(--f-mono); width: 26px; height: 26px; text-align: center; border-radius: 8px; background: var(--lime-soft); color: var(--lime-ink); flex: none; }
.modules{ display: grid; gap: 10px; }
.module{ border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
.module-head{ width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: 0; text-align: left; }
.module-head b{ flex: 1; font-size: 16px; font-weight: 600; font-family: var(--f-display); }
.module-n{ font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); width: 74px; flex: none; }
.module-count{ font: 500 13px var(--f-mono); color: var(--mute); }
.chev{ transition: transform var(--t) var(--ease); color: var(--mute); }
.module.open .chev, .acc-item.open .chev { transform: rotate(180deg); }
.module-body{ display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.module.open .module-body{ grid-template-rows: 1fr; }
.module-body > ul{ overflow: hidden; list-style: none; margin: 0; padding: 0 8px; }
.module.open .module-body > ul{ padding-bottom: 8px; }
.lesson-line{ width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 10px; border: 0; background: none; border-radius: 10px; text-align: left; font-size: 14.5px; }
.lesson-line:hover{ background: var(--hover); }
.ll-ico{ width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--line-2); color: var(--mute); }
.ll-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.lesson-line.done .ll-ico{ background: var(--lime); border-color: var(--lime); color: var(--ink); }
.lesson-line.next .ll-ico{ background: var(--blue); border-color: var(--blue); color: #fff; }
.lesson-line.done .ll-t{ color: var(--mute); }
.ll-n{ font: 500 12.5px var(--f-mono); color: var(--mute); width: 20px; }
.ll-t{ flex: 1; min-width: 0; }
.ll-tag{ font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--blue); background: var(--blue-soft); padding: 4px 7px; border-radius: 6px; }
.ll-min{ font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.course-side{ display: grid; gap: 22px; position: sticky; top: 88px; }
.project-brief{ background: var(--ink); color: #fff; border-radius: 22px; padding: 24px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.project-brief .eyebrow{ color: var(--lime); margin: 0; }
.project-brief h3{ color: #fff; font-size: 21px; line-height: 1.2; }
.project-brief > p{ color: #C9C7DA; font-size: 14.5px; }
.pb-expected{ padding: 14px; border-radius: 12px; background: rgba(255,255,255,.06); }
.pb-expected small{ font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: #8D8BA3; }
.pb-expected p{ font-size: 14px; color: #E7E6F0; margin-top: 4px; }
.pb-steps{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pb-steps li{ display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D7D5E6; }
.pb-steps li span{ width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; font: 500 12px var(--f-mono); background: rgba(255,255,255,.08); flex: none; }
.pb-steps li.done span{ background: var(--lime); color: var(--ink); }
.pb-steps li.done{ color: #8D8BA3; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
.pb-status{ display: flex; align-items: center; gap: 10px; }
.pb-status small{ color: #A6A4BA; }
.project-brief .pill-progress{ background: rgba(171,166,255,.14); color: var(--blue-on-dark); }
.project-brief .pill-ok{ background: rgba(201,226,63,.13); color: var(--lime); }
.cert-req{ padding: 20px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); display: grid; gap: 10px; }
.req{ list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.req li{ display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--mute); }
.req li small{ margin-left: auto; font: 500 12.5px var(--f-mono); }
.req li.ok{ color: var(--fg); }
.req li.ok .ico{ color: var(--lime-ink); }
.cert-ok{ display: flex; gap: 8px; align-items: center; color: var(--lime-ink); font-weight: 500; }

/* ---------- Sala de aula ---------- */
.classroom{ padding-top: 18px; background: #08080D; }
.classroom > *{ max-width: 1400px; }
.class-top{ display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.class-top .backlink{ margin: 0; min-width: 0; }
.class-top .backlink span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.class-top-prog{ display: flex; align-items: center; gap: 10px; flex: 1; max-width: 280px; margin-left: auto; font: 500 13px var(--f-mono); color: #A6A4BA; }
.class-grid{ display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; transition: grid-template-columns var(--t) var(--ease); }
.classroom.focus .class-grid{ grid-template-columns: minmax(0, 1fr) 0px; gap: 0; }
.classroom.focus .class-side{ opacity: 0; pointer-events: none; transform: translateX(20px); }
.classroom.focus .class-main{ max-width: 1080px; margin: 0 auto; width: 100%; }
.class-main{ min-width: 0; display: grid; gap: 20px; }
.player{ border-radius: 18px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,.06); }
.player-stage{ position: relative; aspect-ratio: 16 / 9; cursor: pointer; background: var(--ink-2); overflow: hidden; }
.slide{ position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.slide-k{ font: 500 clamp(11px, 1.1vw, 14px) var(--f-mono); color: var(--lime); text-transform: uppercase; letter-spacing: .08em; }
.slide-t{ font-size: clamp(24px, 3.6vw, 52px); line-height: 1.04; letter-spacing: -0.035em; max-width: 14ch; color: #fff; }
.slide-art{ position: absolute; right: 0; top: 0; height: 100%; width: auto; opacity: .9; }
.player.playing .slide-art{ animation: drift 18s linear infinite alternate; }
.player-demo{ position: absolute; top: 14px; right: 14px; font: 500 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: #8D8BA3; background: rgba(0,0,0,.4); padding: 6px 8px; border-radius: 6px; }
.player-big{ position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 76px; height: 76px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; transition: transform .3s var(--ease); box-shadow: 0 10px 40px -10px rgba(201,226,63,.5); }
.player-big .ico{ margin-left: 4px; }
.player-stage:hover .player-big{ transform: translate(-50%, -50%) scale(1.06); }
.player-cc{ position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 80%; text-align: center; background: rgba(0,0,0,.72); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: clamp(13px, 1.3vw, 16px); }
.player-bar{ display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: #0E0E16; color: #E7E6F0; }
.player-bar .icon-btn{ width: 36px; height: 36px; }
.player-time{ font: 500 12.5px var(--f-mono); color: #A6A4BA; padding: 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.scrub{ flex: 1; height: 24px; position: relative; cursor: pointer; display: flex; align-items: center; }
.scrub::before{ content: ""; position: absolute; left: 0; right: 0; height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); }
.scrub-fill{ position: absolute; left: 0; height: 4px; border-radius: 4px; background: var(--lime); transition: width .5s linear; }
.scrub-knob{ position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translateX(-50%); transition: left .5s linear; }
.player-speed{ background: none; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; height: 28px; padding: 0 8px; font: 500 12px var(--f-mono); color: #E7E6F0; margin: 0 4px; }
.class-titlebar{ display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
.class-titlebar h1{ font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -0.025em; }
.class-titlebar .eyebrow{ margin-bottom: 6px; }
.class-actions{ display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.class-actions .icon-btn{ border: 1px solid rgba(255,255,255,.12); }
.class-tab{ animation: fadeUp .3s var(--ease); }
.class-tab .tabs{ margin-bottom: 0; }
.classroom .tabs{ margin-bottom: 0; }
.prose{ display: grid; gap: 10px; max-width: 70ch; font-size: 16px; color: #D7D5E6; }
.class-project{ display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 20px; border-radius: 16px; border: 1px solid var(--line); flex-wrap: wrap; }
.class-project h3{ font-size: 18px; margin-bottom: 6px; }
.class-project > div{ display: grid; gap: 6px; max-width: 60ch; }
.class-side{ position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--ink-2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; transition: opacity var(--t), transform var(--t) var(--ease); }
.class-side-head{ display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.class-side-head div{ display: grid; gap: 2px; }
.class-side-head b{ font-size: 15px; }
.class-side-head small{ color: var(--mute); font-size: 12.5px; }
.side-mod{ padding: 10px 0 4px; }

/* ---------- Movimento ---------- */
.rise{ animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes routeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes drawerIn { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growW { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes markIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes checkPop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes starIn { from { opacity: 0; transform: scale(.3) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes wordIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-24px); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes cvFlash { 0% { background: rgba(201,226,63,.45); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after{ animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after{ animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }

.ad-listed-add{ display: flex; gap: 8px; } .ad-listed-add input{ flex: 1; }
.ad-slots{ display: grid; grid-template-columns: 1.4fr .8fr 1.4fr; gap: 16px; align-items: start; }

.ad-cover-ed{ display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; }
.ad-focus{ position: relative; border-radius: 12px; overflow: hidden; cursor: crosshair; background: var(--paper-3); outline: none; }

.ad-drop{ display: grid; justify-items: center; gap: 8px; text-align: center; padding: 36px 20px; margin-top: 14px; border: 2px dashed var(--line-2); border-radius: 16px; cursor: pointer; color: var(--mute); transition: border-color var(--t), background var(--t); }

/* Conteúdo: módulos e aulas */
.ad-content{ display: grid; gap: 14px; }
.ad-mod{ padding: 14px; border-radius: 16px; background: #fff; border: 1px solid var(--line); display: grid; gap: 8px; }

.ad-mod-title{ flex: 1 1 220px; font-weight: 600; }

.ad-lessons{ list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

.ad-l-n{ font: 600 12px var(--f-mono); color: var(--mute); width: 22px; text-align: center; flex: none; }
.ad-l-main{ flex: 1; min-width: 0; display: grid; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 8px; color: var(--fg); }

.ad-l-main small{ font-size: 12.5px; color: var(--mute); }
.ad-switch{ display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); cursor: pointer; white-space: nowrap; }
.ad-switch input{ width: 32px; height: 18px; appearance: none; border-radius: 99px; background: #D5D3E2; position: relative; cursor: pointer; transition: background var(--t); flex: none; }
.ad-switch input::after{ content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform var(--t) var(--ease); }
.ad-switch input:checked{ background: #1FA36A; }
.ad-switch input:checked::after{ transform: translateX(14px); }
.ad-switch input:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
.ad-switch input:disabled{ opacity: .5; cursor: not-allowed; }
.ad-mats{ list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ad-mats li{ display: flex; align-items: center; gap: 8px; }
.ad-mats li input{ flex: 0 1 220px; }
.ad-mats li small{ flex: 1; min-width: 0; color: var(--mute); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad-mat-add{ display: flex; gap: 8px; flex-wrap: wrap; }
.ad-mat-add input{ flex: 1 1 160px; }
.ad-radio-cards{ display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ad-rc{ position: relative; display: grid; gap: 4px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); cursor: pointer; background: #fff; }

.ad-rc b{ font-size: 14.5px; } .ad-rc small{ color: var(--mute); font-size: 12.5px; }
.ad-rc.on{ border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45,36,200,.1); }
.ad-rc:has(input:focus-visible){ outline: 2px solid var(--focus); outline-offset: 2px; }
.ad-pickl{ display: grid; gap: 6px; max-height: 220px; overflow-y: auto; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.ad-preview{ display: grid; gap: 12px; }
.ad-preview-frame{ border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--ink); color: #F3F2F8; pointer-events: auto; }
.ad-preview-frame .course-page{ min-height: 0; }
/* Listas simples, categorias, mídia */
.ad-simple{ list-style: none; margin: 0; padding: 0; display: grid; }
.ad-simple li{ display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ad-simple li:last-child{ border-bottom: 0; }
.ad-simple small{ color: var(--mute); font-size: 12.5px; }
.ad-cats{ list-style: none; margin: 0; padding: 0; }
.ad-cats li{ display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ad-cats li:last-child{ border-bottom: 0; }
.ad-cats li.off .ad-cat-t{ opacity: .55; }
.ad-cat-n{ font: 600 12px var(--f-mono); color: var(--mute); width: 20px; text-align: right; }
.ad-cat-ico{ width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); flex: none; }
.ad-cat-img{ width: 36px; height: 36px; border-radius: 10px; object-fit: cover; flex: none; }
.ad-cat-t{ flex: 1; min-width: 0; display: grid; } .ad-cat-t small{ color: var(--mute); font-size: 12.5px; }
.ad-icon-grid{ display: flex; flex-wrap: wrap; gap: 6px; }
.ad-icon-grid button{ width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; color: var(--fg); }

.ad-order{ list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ad-order li{ display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; cursor: grab; }
.ad-order li.dragging{ box-shadow: 0 0 0 2px var(--blue); }
.ad-order-n{ font: 600 12px var(--f-mono); color: var(--mute); width: 20px; }
.ad-media-grid{ list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.ad-media-grid button{ width: 100%; display: grid; gap: 8px; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: #fff; text-align: left; color: var(--fg); position: relative; }
.ad-media-grid button:hover{ border-color: var(--blue); }
.ad-media-t{ display: grid; } .ad-media-t b{ font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ad-media-t small{ font-size: 12px; color: var(--mute); }
.ad-media-use{ position: absolute; top: 14px; left: 14px; font: 500 11px var(--f-ui); padding: 3px 7px; border-radius: 6px; background: rgba(11,11,18,.72); color: #fff; }
.ad-media-use.none{ background: rgba(255,255,255,.9); color: var(--mute); }
.ad-media-detail{ display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
.ad-media-prev{ display: grid; place-items: center; background: var(--paper-3); border-radius: 12px; min-height: 200px; overflow: hidden; }
.ad-media-prev img, .ad-media-prev video{ display: block; max-width: 100%; max-height: 420px; }
.ad-dl{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0 0 14px; }
.ad-dl.wide{ grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

.ad-dl dd{ margin: 2px 0 0; font-size: 14px; }
.ad-prog{ list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.ad-prog li{ display: grid; gap: 6px; }
.ad-prog-t{ display: flex; justify-content: space-between; gap: 10px; font-size: 14px; } .ad-prog-t span{ color: var(--mute); font-size: 13px; white-space: nowrap; }
.ad-prog small{ color: var(--mute); font-size: 12.5px; }
.ad-matrix td, .ad-matrix th{ padding: 8px 10px; font-size: 13px; }
.ad-matrix .ico{ color: #13804F; }
.ad-rep-nav{ display: flex; gap: 8px; flex-wrap: wrap; }
.ad-rep-nav button{ display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; color: var(--fg); }
.ad-rep-nav button.on{ border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.ad-defs summary{ display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.ad-defs dl{ display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 24px; margin: 16px 0; }
.ad-defs dt{ font-weight: 600; font-size: 14px; } .ad-defs dd{ margin: 3px 0 0; font-size: 13.5px; color: var(--mute); }
.ad-denied{ min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 20px; padding: 24px; }
.ad-scrim{ display: none; }
.modal-foot .grow{ flex: 1; }
@media (max-width: 1180px) {
  .ad-grid-3{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-radio-cards{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-user-t{ display: none; }
}
@media (max-width: 960px) {
  .ad-app, .ad-app.collapsed{ grid-template-columns: minmax(0, 1fr); }
  .ad-side{ position: fixed; left: 0; top: 0; bottom: 0; z-index: 80; width: 272px; transform: translateX(-100%); transition: transform var(--t) var(--ease); }
  .ad-side.open{ transform: none; box-shadow: 0 0 60px rgba(0,0,0,.5); }

  .ad-app.collapsed .ad-nav{ justify-content: flex-start; padding: 10px 12px; }

  .ad-menu-btn{ display: inline-grid !important; }

  .ad-slots{ grid-template-columns: 1fr 1fr; }
  .ad-mode-chip{ display: none; }
  .ad-top-title{ display: none; }
  .ad-search{ margin-left: 0; }
}
@media (max-width: 640px) {
  .ad-top{ padding-left: 12px; padding-right: 12px; gap: 8px; }
  .ad-page{ padding: 20px 14px 72px; }
  .ad-fgrid{ grid-template-columns: minmax(0, 1fr); }
  .ad-fgrid .span-2{ grid-column: auto; }
  .ad-slots{ grid-template-columns: 1fr; }
  .ad-radio-cards{ grid-template-columns: 1fr; }
  .ad-metrics, .ad-metrics.small{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-metric > b{ font-size: 22px; }

  .ad-feed li{ grid-template-columns: 32px minmax(0, 1fr); } .ad-feed small{ grid-column: 2; text-align: left; }
  .ad-lessons li{ flex-wrap: wrap; }
  .ad-l-main{ flex-basis: calc(100% - 40px); }
  .ad-savebar{ top: 60px; }
  .ad-dl{ grid-template-columns: 1fr; }
  .ad-mode{ padding: 10px 14px; }
  .ad-head-actions{ width: 100%; }
}
.ad-page{ grid-template-columns: minmax(0, 1fr); }
.ad-page > *{ min-width: 0; }
.ad-search{ min-width: 0; }
@media (max-width: 640px) { .ad-user > .ico{ display: none; } .ad-user{ padding: 2px; } .ad-search{ flex: 1 1 auto; } }

/* ================= Jornada (v7): skills, cursos em andamento, indicadores ================= */
.dash-skills .panel-head, .career .panel-head { align-items: flex-end; }
/* Gráfico de skills */
@keyframes spin { to { transform: rotate(360deg); } }

/* Cursos em andamento */
.cprog-art { position: relative; }
.cprog-pct { position: absolute; right: 12px; bottom: 12px; font: 600 15px var(--f-display); background: rgba(11,11,18,.82); color: var(--lime); padding: 4px 10px; border-radius: 99px; backdrop-filter: blur(6px); }
.cprog .pcard-body { gap: 10px; flex: 1; align-content: start; }
.cprog-bar { display: flex; align-items: center; gap: 10px; }
.cprog-bar small { font-size: 12.5px; color: var(--mute); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cprog-go { margin-top: auto; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); transition: border-color var(--t), background var(--t); }
.cprog-go:hover { border-color: var(--lime); }
.cprog-go small { display: block; font-size: 11.5px; color: var(--mute); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.cprog-go b { display: block; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cprog-play { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
.dash-empty-courses { display: grid; gap: 24px; }
.dec-text { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.dec-text h3 { font-size: 18px; margin-bottom: 4px; }
.dec-ico { width: 48px; height: 48px; border-radius: 14px; background: rgba(201,226,63,.12); color: var(--lime); display: grid; place-items: center; }
.dec-recs { padding-top: 20px; border-top: 1px solid var(--line); }

/* Indicadores */
.jstats { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.jstat { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
.jstat > button { width: 100%; height: 100%; text-align: left; display: grid; align-content: start; gap: 10px; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); transition: border-color var(--t), transform .3s var(--ease); }
.jstat > button:hover { border-color: var(--line-2); transform: translateY(-2px); }
.jstat-top { display: flex; align-items: center; gap: 10px; }
.jstat-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.jstat-k { font: 500 11.5px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.jstat-v { display: flex; align-items: flex-end; gap: 6px; min-height: 46px; }
.jstat-v > b { font: 600 clamp(32px, 3.2vw, 42px)/1 var(--f-display); letter-spacing: -0.03em; }
.jstat-v > small { font: 500 15px var(--f-ui); color: var(--mute); margin-bottom: 4px; }
.jstat-vis { margin-left: auto; align-self: center; }
.jstat-note { font-size: 13px; color: var(--mute); line-height: 1.35; }
.jstat.is-empty .jstat-v > b { color: var(--mute); }
.jstat-aulas .jstat-ico, .jstat-iniciados .jstat-ico { background: rgba(171,166,255,.14); color: var(--blue-on-dark); }

.mini-bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }

.pips { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 92px; justify-content: flex-end; }

/* Meu progresso: onde você está */
.where-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 36px; align-items: start; }

.prog-where .course-bars li { grid-template-columns: minmax(0, 180px) minmax(0, 1fr) 46px; gap: 12px; }

/* ================= Objetivos ================= */
.obj-hero { background: var(--blue); color: #fff; border-radius: 26px; padding: 28px 30px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.obj-hero::after { content: ""; position: absolute; right: -40px; top: -30px; width: 220px; height: 300px; background: rgba(255,255,255,.07); -webkit-mask: var(--mark-mask) center / contain no-repeat; mask: var(--mark-mask) center / contain no-repeat; transform: rotate(-10deg); pointer-events: none; }
.obj-q { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.8); }
.obj-q span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--ink); font-size: 11.5px; }
.obj-q.dark { color: var(--mute); margin-bottom: 4px; }
.obj-q.dark span { background: var(--blue); color: #fff; }
.obj-k { font: 600 clamp(15px, 1.4vw, 17px) var(--f-display); color: #fff; }
.obj-ta { position: relative; z-index: 1; width: 100%; resize: vertical; min-height: 84px; border-radius: 14px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; padding: 14px 16px; font: 600 clamp(19px, 2.2vw, 26px)/1.25 var(--f-display); letter-spacing: -0.015em; }
.obj-ta::placeholder { color: rgba(255,255,255,.55); font-weight: 500; }
.obj-ta:focus { outline: none; border-color: var(--lime); background: rgba(255,255,255,.12); }
.obj-foot { position: relative; z-index: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.obj-state { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); }
.obj-state.dirty { color: var(--lime); }
.obj-count { color: rgba(255,255,255,.6); font-family: var(--f-mono); font-size: 12px; }
.obj-trail { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.12); }
.obj-actions { margin-left: auto; display: flex; gap: 8px; }
.obj-ex { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.obj-ex small { color: rgba(255,255,255,.7); margin-right: 4px; }
.obj-ex button { border: 1px dashed rgba(255,255,255,.4); background: none; color: #fff; border-radius: 99px; padding: 5px 11px; font-size: 13px; }
.obj-ex button:hover { background: rgba(255,255,255,.1); }
.goal-detail2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.goal-sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 24px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.goal-sec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.goal-sec-head .h-sec { margin-bottom: 0; }
.skp-count { color: var(--blue); font-weight: 600; }
.skp-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.skp-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px 0 11px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; transition: background var(--t), border-color var(--t), color var(--t), transform .2s var(--ease); }
.skp-chip:hover { border-color: var(--blue); }
.skp-chip:active { transform: scale(.97); }
.skp-chip .ico { color: var(--mute); }
.skp-chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.skp-chip.on .ico { color: var(--lime); }
.skp-chip em { font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-c); }
.skp-chip.on em { background: rgba(255,255,255,.18); color: #fff; }
.skp-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--input); margin-bottom: 10px; }

.skp-search input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; min-width: 0; }
.skp-groups { display: grid; gap: 18px; margin-top: 16px; }
.skp-group .eyebrow { margin-bottom: 8px; }
.rec-how { display: flex; gap: 6px; align-items: flex-start; }
.rec-how .ico { margin-top: 3px; }
.rec-empty { display: flex; gap: 10px; align-items: center; padding: 18px; border-radius: 12px; background: var(--card-2); color: var(--mute); font-size: 14px; }
.rec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rec-list button { width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; border: 0; background: none; color: var(--fg); transition: background var(--t); }
.rec-list button:hover { background: var(--hover); }
.rec-art { width: 56px; border-radius: 12px; overflow: hidden; }
.rec-art .art-glyph { font-size: 18px; }
.rec-body { display: grid; gap: 3px; min-width: 0; }
.rec-body b { font-size: 15px; font-weight: 600; }
.rec-meta { font-size: 12.5px; color: var(--mute); }
.rec-skills { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }
.rec-skills em { font-style: normal; font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin-right: 2px; }
.rec-skills i { font-style: normal; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); }
.trails .section-head { margin-bottom: 18px; }
.trail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.trail-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 16px; align-content: start; box-shadow: var(--shadow); transition: border-color var(--t), transform .3s var(--ease); position: relative; }
.trail-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.trail-card.current { border: 2px solid var(--blue); padding: 21px; }
.trail-card > header { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
