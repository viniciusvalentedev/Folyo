.trail-card header p { font-size: 13.5px; color: var(--mute); }
.trail-ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); }
.trail-card.current .trail-ico { background: var(--blue); color: var(--lime); }
.trail-badge { position: absolute; top: -11px; right: 18px; font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; background: var(--blue); color: #fff; padding: 4px 10px; border-radius: 99px; }
.trail-k { display: flex; justify-content: space-between; gap: 8px; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin-bottom: 8px; }
.trail-k span { text-transform: none; letter-spacing: 0; font: 400 12px var(--f-ui); }
.trail-skills { display: flex; flex-wrap: wrap; gap: 5px; }
.trail-skills span { font-size: 12.5px; padding: 4px 9px; border-radius: 99px; background: var(--card-2); color: var(--fg); }
.trail-skills span.on { background: var(--blue-soft); color: var(--blue); font-weight: 500; }
.trail-skills span.on::before { content: "✓ "; }
.trail-courses { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.trail-courses button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px; border-radius: 9px; text-align: left; font-size: 13.5px; color: var(--fg); }
.trail-courses button:hover { background: var(--hover); }
.trail-art { width: 30px; border-radius: 8px; overflow: hidden; flex: none; }
.trail-art .art-glyph { font-size: 11px; }
.trail-card footer { padding-top: 4px; }
.apply-row { display: grid; gap: 6px; }
.apply-change { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; }
.apply-change s { color: var(--mute); }
.apply-modes { display: grid; gap: 8px; }
.apply-modes label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line-2); cursor: pointer; }
.apply-modes label.on { border-color: var(--blue); background: var(--blue-soft); }
.apply-modes input { accent-color: var(--blue); margin-top: 3px; }
.apply-modes b { display: block; font-size: 14.5px; }
.apply-modes small { color: var(--mute); font-size: 13px; }

/* ================= Projetos e portfólio ================= */
.pf-courses, .pf-projects-sec { display: grid; gap: 16px; }
.pf-courses .section-head, .pf-projects-sec .section-head { margin-bottom: 0; }
.store-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--mute); padding: 10px 14px; border-radius: 10px; background: var(--card-2); }
.store-note .ico { margin-top: 2px; }
.cworks { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.cworks-head { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: start; }
.cworks-art { border: 0; padding: 0; background: none; border-radius: 14px; overflow: hidden; display: block; }
.cworks-art .art { transition: transform .4s var(--ease); }
.cworks-art:hover .art { transform: scale(1.03); }
.cworks-info { display: grid; gap: 6px; min-width: 0; }
.cworks-info h3 { font-size: 20px; }
.cworks-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); }
.cworks-meta span { display: inline-flex; align-items: center; gap: 5px; }
.cworks-meta .ok { color: var(--ok-ink); font-weight: 500; }
.cworks-sum { font-size: 14px; color: var(--mute); max-width: 70ch; }
.cworks-proj { justify-self: start; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 0; background: none; padding: 0; color: var(--link); font-size: 13.5px; font-weight: 500; text-align: left; }
.cworks-proj:hover { text-decoration: underline; text-underline-offset: 3px; }
.cworks-drop { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 14px; display: grid; gap: 12px; transition: border-color var(--t), background var(--t); }
.cworks-drop.drag { border-color: var(--blue); background: var(--blue-soft); }
.cworks-drop.busy { opacity: .75; }
.cworks-empty { font-size: 14px; color: var(--mute); padding: 4px 4px 0; }
.cworks-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cworks-add small { font-size: 12.5px; }
.works { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.work { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--card-2); animation: fadeUp .3s var(--ease); }
.work.busy { opacity: .6; pointer-events: none; }
.work-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; }
.work-ico.pdf { background: var(--err-bg); color: var(--err-c); }
.work-ico.link { background: var(--blue-soft); color: var(--blue); }
.work-text { min-width: 0; display: grid; gap: 1px; }
.work-text b { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-text small { font-size: 12.5px; color: var(--mute); }
.work-text p { font-size: 13px; color: var(--mute); margin-top: 3px; }
.work-miss { color: var(--warn-c); font-style: normal; }
.work-pub .toggle { font-size: 13px; }
.work-actions { display: flex; gap: 2px; }
.work-actions .icon-btn { width: 36px; height: 36px; color: var(--mute); }
.work-actions .icon-btn:hover:not(:disabled) { color: var(--fg); }
.icon-btn.danger:hover:not(:disabled) { color: var(--err-c) !important; background: var(--err-bg); }
.pdf-frame { width: 100%; height: min(70vh, 720px); border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); margin-bottom: 8px; }

/* Portfólio público */
.public-main > * + * { margin-top: 48px; }
.public-main > .eyebrow + * { margin-top: 12px; }
.public-goal { display: flex; align-items: flex-start; gap: 8px; font: 500 17px/1.4 var(--f-display); color: var(--lime); max-width: 60ch; margin-top: 10px; }
.public-goal .ico { margin-top: 3px; }
.public-groups { display: grid; gap: 18px; }
.pgroup { border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; background: var(--card); }
.pgroup > header { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; }
.pgroup h3 { font-size: 18px; }
.pgroup small { font-size: 13px; color: var(--mute); }
.pgroup-art { width: 56px; border-radius: 12px; overflow: hidden; }
.pgroup-art .art-glyph { font-size: 18px; }
.pworks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pw { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card-2); }
.pw b { font-size: 15px; }
.pw p { font-size: 13.5px; color: var(--mute); }
.pw small { font-size: 12.5px; color: var(--mute); }
.pw-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ================= Certificados · A caminho ================= */
.otw { padding: 26px; border-radius: 24px; background: var(--ink-2); border: 1px solid var(--line); display: grid; gap: 18px; }
.otw-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.otw-head .h-sec { margin-bottom: 4px; }
.otw-head p { font-size: 14px; max-width: 60ch; }
.otw-legend { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.otw-st { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding: 4px 9px; border-radius: 99px; width: max-content; }
.otw-st b { font: 600 12px var(--f-ui); margin-left: 2px; }
.otw-st.st-lime { background: rgba(201,226,63,.14); color: var(--lime); }
.otw-st.st-magenta { background: rgba(221,51,207,.14); color: #F07FE6; }
.otw-st.st-blue { background: rgba(171,166,255,.14); color: var(--blue-on-dark); }
.otw-st.st-muted { background: rgba(255,255,255,.07); color: #B9B7CB; }
.otw-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.otw-card { border-radius: 18px; border: 1px solid var(--line); background: var(--ink-3); padding: 18px; display: grid; gap: 14px; align-content: start; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); position: relative; overflow: hidden; }
.otw-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; }
.otw-card.st-lime::before { background: var(--lime); }
.otw-card.st-magenta::before { background: var(--magenta); }
.otw-card.st-blue::before { background: var(--blue-on-dark); }
.otw-card.st-muted { background: transparent; border-style: dashed; }
.otw-top { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.otw-art { width: 48px; border-radius: 11px; overflow: hidden; }
.otw-art .art-glyph { font-size: 15px; }
.otw-title { display: grid; gap: 6px; min-width: 0; }
.otw-title h3 { font-size: 15.5px; line-height: 1.3; }
.otw-req { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.otw-req li { display: grid; grid-template-columns: 16px 58px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; color: #D7D5E6; }
.otw-req li .ico { color: var(--mute); }
.otw-req li.ok .ico { color: var(--lime); }
.otw-req small { font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.otw-req .otw-proj { grid-column: 3 / -1; white-space: normal; }
.otw-go { display: flex; align-items: center; gap: 8px; border: 0; background: rgba(255,255,255,.06); color: #fff; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; font-weight: 500; text-align: left; transition: background var(--t); }
.otw-go span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.otw-go:hover { background: var(--lime); color: var(--ink); }
.otw-sub { margin: 6px 0 -4px; }

/* Responsivo (v7) */
@media (max-width: 1180px) {
}
@media (max-width: 1080px) {
  .goal-detail2 { grid-template-columns: minmax(0, 1fr); }
  .where-grid { grid-template-columns: minmax(0, 1fr); }
  .where-grid > div + div { padding-left: 0; border-left: 0; padding-top: 24px; border-top: 1px solid var(--line); }
}

}

}


/* Com um diálogo aberto, os avisos sobem para não cobrir os botões do rodapé do diálogo. */

.toast { pointer-events: auto; }
body:has(.modal-scrim) .toasts { bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); }

@media (min-width: 1081px) { .where-grid { grid-template-columns: minmax(0, .95fr) minmax(0, 1.5fr); } }
.prog-where .course-bars li { grid-template-columns: minmax(0, 1.4fr) minmax(70px, 1fr) 40px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.prog-where .cb-name { white-space: normal; line-height: 1.3; }

/* ================= Indicadores (v9): reorganizam pela largura disponível, sem estourar ================= */

.jstats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.jstats-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@container (max-width: 1100px) { .jstats-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (max-width: 760px) { .jstats-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 560px) { .jstats-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.jstat > button { grid-template-rows: auto auto auto 1fr; min-width: 0; overflow: hidden; }
.jstat > button:disabled { cursor: default; transform: none; }

@keyframes onbIn { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 18px)); } to { opacity: 1; transform: none; } }
.onb3-lead { margin: 8px 0 24px; color: var(--mute); }

.onb3-card { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) 22px; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; transition: border-color var(--t), box-shadow var(--t), transform .2s var(--ease); }

.onb3-t small { font-size: 13.5px; line-height: 1.4; color: var(--mute); }

.onb3-chips { display: flex; flex-wrap: wrap; gap: 10px; }

.onb3-chip:focus-visible, .onb3-want:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  background: radial-gradient(70% 80% at 50% 55%, rgba(45,36,200,.16), rgba(45,36,200,0) 70%), radial-gradient(40% 50% at 78% 20%, rgba(221,51,207,.08), rgba(221,51,207,0) 70%); }

.lp{ --lp-max: 1200px; --lp-pad: max(16px, env(safe-area-inset-left, 0px)); --lp-pad-r: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); color: #F3F2F8; overflow-x: clip; min-height: 100vh; }

.lp-btn:hover{ text-decoration: none; transform: translateY(-2px); }
.lp-btn:active{ transform: translateY(0) scale(.98); }
.lp-btn::after{ content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s var(--ease); }
.lp-btn:hover::after{ transform: translateX(120%); }
.lp-btn-glow:hover{ box-shadow: 0 12px 30px -10px rgba(221,51,207,.65); }
.lp-btn-free:hover{ box-shadow: 0 12px 30px -10px rgba(201,226,63,.55); }
.lp-btn .ico{ transition: transform .3s var(--ease); }
.lp-btn:hover .ico:last-child{ transform: translateX(3px); }
.lp-btn.btn-quiet-dark:hover .ico:last-child{ transform: translateY(3px); }
.lp :focus-visible{ outline: 2px solid var(--lime); outline-offset: 3px; }

/* Cabeçalho */
.lp-head{ position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding-top: env(safe-area-inset-top, 0px); transition: background .35s var(--ease), border-color .35s, backdrop-filter .35s; border-bottom: 1px solid transparent; }
.lp-head.solid{ background: rgba(11,11,18,.78); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom-color: rgba(255,255,255,.07); }
.lp-head-in{ max-width: var(--lp-max); margin: 0 auto; height: 68px; display: flex; align-items: center; gap: 24px; padding-left: var(--lp-pad); padding-right: var(--lp-pad-r); }
.lp-logo{ display: inline-flex; padding: 4px 0; animation: fadeIn .6s var(--ease) both; }
.lp-logo .wordmark{ transition: transform .35s var(--ease); transform-origin: left center; }
.lp-logo:hover .wordmark{ transform: rotate(-3deg) scale(1.03); }
.lp-anchors{ display: flex; gap: 4px; margin-left: 12px; }
.lp-anchors a{ color: #B9B7CB; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 9px; transition: color var(--t), background var(--t); }
.lp-anchors a:hover{ color: #fff; background: rgba(255,255,255,.06); text-decoration: none; }
.lp-auth{ margin-left: auto; display: flex; gap: 8px; align-items: center; }
.lp-auth .btn-sm{ height: 38px; padding: 0 16px; font-size: 14px; }

/* Hero */
.lp-hero{ --px: 0; --py: 0; position: relative; isolation: isolate; overflow: hidden; padding-top: calc(68px + env(safe-area-inset-top, 0px)); background: var(--ink); }
.lp-hero-glow{ position: absolute; inset: -20% -10% auto auto; width: 70vw; max-width: 980px; aspect-ratio: 1; z-index: -1; background: radial-gradient(closest-side, rgba(106,77,255,.30), rgba(221,51,207,.14) 55%, transparent 72%); transform: translate3d(calc(var(--px) * -18px), calc(var(--py) * -14px), 0); transition: transform .6s var(--ease); pointer-events: none; }
.lp-hero::before{ content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); pointer-events: none; }
.lp-hero-in{ max-width: var(--lp-max); margin: 0 auto; padding-left: var(--lp-pad); padding-right: var(--lp-pad-r); padding-block: clamp(32px, 5.5vw, 72px) clamp(40px, 5vw, 64px); display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.lp-hero-text{ min-width: 0; display: grid; gap: 22px; justify-items: start; }
.lp-kicker{ display: inline-flex; align-items: center; gap: 10px; font: 500 12.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); padding: 9px 14px 9px 12px; border: 1px solid rgba(201,226,63,.28); border-radius: 99px; background: rgba(201,226,63,.06); }
.lp-dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(201,226,63,.6); animation: lpPing 2.4s ease-out infinite; }
.lp-title{ font: 600 clamp(44px, 6.3vw, 92px)/.95 var(--f-display); letter-spacing: -0.045em; color: #fff; display: grid; text-wrap: initial; }
.lp-line{ display: block; position: relative; }
.lp-w{ display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .16em; margin-bottom: -.16em; }
.lp-w > span{ display: inline-block; animation: lpWord .9s var(--ease) both; animation-delay: var(--d, 0ms); }
.lp-hl > span{ background: linear-gradient(100deg, #8D74FF 0%, #E234CF 55%, #F59AEA 100%); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: lpWord .9s var(--ease) both, lpSheen 7s 1.4s ease-in-out infinite alternate; animation-delay: var(--d, 0ms), 1.4s; padding-right: .04em; }
.lp-swoosh{ position: absolute; left: 0; bottom: -.04em; width: min(4.3em, 92%); height: .26em; overflow: visible; pointer-events: none; }
.lp-swoosh path{ fill: none; stroke: var(--lime); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: lpDraw .9s .75s var(--ease) forwards; vector-effect: non-scaling-stroke; }
.lp-lead{ font-size: clamp(16.5px, 1.5vw, 19px); line-height: 1.55; color: #C3C1D4; max-width: 46ch; }
.lp-in{ animation: lpUp .8s var(--ease) both; animation-delay: var(--d, 0ms); }
.lp-ctas{ display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.lp-ctas .btn-lg{ height: 54px; padding: 0 24px; font-size: 15.5px; border-radius: 13px; }

/* Palco do hero: camadas com profundidade */
.lp-stage{ position: relative; height: clamp(380px, 44vw, 560px); min-width: 0; animation: fadeIn 1s .2s var(--ease) both; }
.lp-layer{ position: absolute; transform: translate3d(calc(var(--px) * var(--z) * -0.5px), calc(var(--py) * var(--z) * -0.5px), 0); transition: transform .5s var(--ease); will-change: transform; }
.lp-layer:first-child{ inset: 0; display: grid; place-items: center; }
.lp-stage-f{ width: 92%; height: auto; max-width: 480px; filter: drop-shadow(0 30px 60px rgba(106,77,255,.35)); animation: lpSpinIn 1.4s .1s var(--ease) both, lpBreath 9s 1.5s ease-in-out infinite alternate; }
.lp-layer:nth-child(2){ right: 6%; top: 4%; }
.lp-stage-f2{ animation: lpFloat 6s ease-in-out infinite alternate; }
.lp-float{ animation: lpFloat 7s ease-in-out infinite alternate; animation-delay: var(--fd, 0s); }
.lp-card{ background: rgba(26,26,38,.78); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 30px 60px -28px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06) inset; color: #fff; }
.lp-l-player{ left: 0; top: 16%; width: min(300px, 62%); }
.lp-player{ overflow: hidden; }
.lp-player-art{ position: relative; aspect-ratio: 16 / 8.5; background: var(--blue); overflow: hidden; }
.lp-player-art svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.lp-play{ position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--blue); box-shadow: 0 0 0 0 rgba(255,255,255,.5); animation: lpPing 2.8s ease-out infinite; }
.lp-play .ico{ margin-left: 3px; fill: currentColor; }
.lp-free-tag{ position: absolute; left: 12px; top: 12px; }
.lp-player-body{ padding: 14px 16px 16px; display: grid; gap: 6px; }
.lp-player-body small, .lp-mini small{ font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #9E9CB2; }
.lp-player-body b{ font: 600 15px/1.25 var(--f-display); letter-spacing: -0.01em; }
.lp-bar{ display: block; height: 5px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; }
.lp-bar span{ display: block; height: 100%; width: 62%; border-radius: inherit; background: var(--lime); transform-origin: left; animation: lpGrow 2.2s 1s var(--ease) both; }
.lp-l-proj{ right: 0; top: 50%; width: min(250px, 54%); }
.lp-l-cert{ left: 14%; bottom: 3%; width: min(260px, 58%); }
.lp-mini{ display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.lp-mini > span:nth-child(2){ display: grid; gap: 3px; min-width: 0; }
.lp-mini b{ font-size: 14px; font-weight: 600; line-height: 1.25; }
.lp-mini-ico{ width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; }
.lp-mini-ico.tone-blue{ background: rgba(171,166,255,.16); color: var(--blue-on-dark); }
.lp-mini-ico.tone-lime{ background: rgba(201,226,63,.14); color: var(--lime); }
.lp-cert-ok{ color: var(--lime); margin-left: auto; }
.lp-skill{ display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 99px; font: 600 13px/1 var(--f-ui); box-shadow: 0 14px 30px -14px rgba(0,0,0,.7); white-space: nowrap; }
.lp-chip-0{ right: 2%; top: 14%; } .lp-chip-1{ left: 4%; top: 3%; } .lp-chip-2{ right: 10%; bottom: 14%; } .lp-chip-3{ left: 2%; top: 64%; }

/* Faixa de skills */
.lp-ticker{ border-top: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07); overflow: hidden; padding-block: 16px; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.lp-ticker-track{ display: flex; width: max-content; animation: lpMarquee 38s linear infinite; }
.lp-ticker:hover .lp-ticker-track{ animation-play-state: paused; }
.lp-ticker-run{ display: flex; flex: none; }
.lp-ticker-run span{ display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; font: 600 clamp(20px, 2.4vw, 30px)/1 var(--f-display); letter-spacing: -0.02em; color: #E7E6F0; white-space: nowrap; }

/* Seções */
.lp-sec{ position: relative; padding-block: clamp(64px, 9vw, 120px); scroll-margin-top: 60px; }
.lp-sec-head{ display: grid; gap: 14px; max-width: 760px; margin-bottom: clamp(32px, 5vw, 56px); }
.lp-sec-head .eyebrow{ margin: 0; }
.lp-h2{ font: 600 clamp(32px, 4.6vw, 58px)/1.02 var(--f-display); letter-spacing: -0.035em; }
.lp-sub{ font-size: 17.5px; line-height: 1.6; color: var(--mute); max-width: 60ch; }
.lp-reveal.is-armed{ opacity: 0; transform: translateY(28px); }
.lp-reveal.is-armed.is-in{ opacity: 1; transform: none; transition: opacity .8s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0ms); }

/* Como funciona (papel) */
.lp-paper{ background: var(--paper); color: var(--ink); --fg: var(--ink); --mute: #5D5B72; --line: #E2E0EC; --line-2: #CFCCE0; --card: #fff; --card-2: var(--paper-3); color-scheme: light; border-radius: 28px 28px 0 0; margin-top: -1px; }
.lp-paper .lp-h2{ color: var(--ink); }
.lp-paper .eyebrow{ color: var(--blue); }
.lp-steps{ list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; counter-reset: none; }
.lp-step{ position: relative; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px 26px; display: grid; gap: 10px; align-content: start; transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .3s; }
.lp-step:hover{ transform: translateY(-6px); box-shadow: 0 28px 50px -30px rgba(45,36,200,.45); border-color: #CFCCE0; }
.lp-step h3{ font: 600 clamp(28px, 2.8vw, 36px)/1 var(--f-display); letter-spacing: -0.035em; color: var(--ink); }
.lp-step:nth-child(1) h3{ color: var(--blue); } .lp-step:nth-child(2) h3{ color: var(--magenta-deep); } .lp-step:nth-child(3) h3{ color: var(--lime-ink); }
.lp-step p{ color: var(--mute); font-size: 15.5px; line-height: 1.55; }
.lp-step-n{ position: absolute; top: 22px; right: 22px; font: 500 12px var(--f-mono); color: #A3A1B8; letter-spacing: .06em; }
.lp-sa{ height: 132px; border-radius: 16px; margin-bottom: 8px; display: grid; place-items: center; position: relative; overflow: hidden; }
.lp-sa-learn{ background: var(--blue-soft); align-content: center; gap: 9px; padding: 0 22px; place-items: stretch; }
.lp-sa-row{ display: flex; align-items: center; gap: 10px; }
.lp-sa-row i{ width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; border: 1.5px solid #CFCCE0; background: #fff; color: transparent; flex: none; }
.lp-sa-row.done i{ background: var(--blue); border-color: var(--blue); color: #fff; }
.lp-sa-row em{ height: 9px; border-radius: 99px; background: #fff; flex: 1; max-width: calc(100% - 20px * var(--i)); }
.lp-step:hover .lp-sa-row.done i .ico{ animation: checkPop .5s var(--ease) both; }
.lp-step:hover .lp-sa-row:nth-child(2) i .ico{ animation-delay: .1s; }
.lp-sa-make{ background: var(--magenta-soft); }
.lp-sa-drop{ width: 66%; height: 76px; border: 2px dashed rgba(184,28,171,.45); border-radius: 14px; display: grid; place-items: center; align-content: center; gap: 4px; color: var(--magenta-deep); background: rgba(255,255,255,.55); transition: transform .4s var(--ease), background .3s; }
.lp-sa-drop small{ font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.lp-step:hover .lp-sa-drop{ transform: scale(1.05) rotate(-1.5deg); background: #fff; }
.lp-sa-win{ background: var(--lime-soft); }
.lp-sa-cert{ width: 62%; height: 86px; border-radius: 10px; background: #fff; box-shadow: 0 14px 30px -18px rgba(78,97,0,.5); display: grid; grid-template-columns: auto 1fr; align-content: center; column-gap: 12px; row-gap: 8px; padding: 0 16px; transform: rotate(-3deg); transition: transform .45s var(--ease); }
.lp-sa-cert svg{ grid-row: span 2; }
.lp-sa-cert em{ height: 8px; border-radius: 99px; background: #E4E2F0; }
.lp-sa-cert em.s{ width: 60%; background: var(--lime); }
.lp-step:hover .lp-sa-cert{ transform: rotate(0) scale(1.04); }
.lp-who{ margin-top: 28px; padding: 22px 24px; border-radius: 20px; background: var(--paper-3); display: grid; gap: 14px; }
.lp-who-t{ color: var(--ink); font-size: 15.5px; }
.lp-who-t b{ font-weight: 600; }
.lp-who ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.lp-who li{ display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--ink); transition: border-color .25s, transform .3s var(--ease); }
.lp-who li .ico{ color: var(--blue); }
.lp-who li:hover{ border-color: var(--blue); transform: translateY(-2px); }

/* Curso gratuito (faixa azul) */
.lp-free{ background: var(--blue); color: #fff; overflow: hidden; isolation: isolate; }
.lp-free-bg{ position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.lp-free-bg::before{ content: ""; position: absolute; width: min(760px, 110vw); aspect-ratio: 181 / 254; left: -12%; top: -38%; transform: rotate(-12deg); background: rgba(255,255,255,.06); -webkit-mask: var(--mark-mask) center / contain no-repeat; mask: var(--mark-mask) center / contain no-repeat; }
.lp-free-bg::after{ content: ""; position: absolute; right: -10%; bottom: -30%; width: 60%; aspect-ratio: 1; background: radial-gradient(closest-side, rgba(221,51,207,.45), transparent 70%); }
.lp-free-grid{ display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
.lp-free-text{ display: grid; gap: 16px; justify-items: start; min-width: 0; }
.lp-badge{ display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--lime); color: var(--ink); font: 600 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 0 0 6px rgba(201,226,63,.16); animation: lpBadge 3s ease-in-out infinite; }
.lp-free-title{ font: 600 clamp(38px, 5.6vw, 76px)/.98 var(--f-display); letter-spacing: -0.04em; color: #fff; max-width: 13ch; }
.lp-free-lead{ font: 500 clamp(18px, 1.7vw, 21px)/1.4 var(--f-display); color: #fff; max-width: 36ch; }
.lp-free-desc{ color: rgba(255,255,255,.82); font-size: 16.5px; line-height: 1.6; max-width: 52ch; }
.lp-facts{ list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14.5px; color: rgba(255,255,255,.9); }
.lp-facts li{ display: inline-flex; align-items: center; gap: 7px; }
.lp-free-cta{ display: grid; gap: 10px; justify-items: start; margin-top: 6px; }
.lp-free-cta .btn-lg{ height: 58px; padding: 0 26px; font-size: 16px; border-radius: 14px; }
.lp-free-cta small{ color: rgba(255,255,255,.72); font-size: 13.5px; }
.lp-free-card{ position: relative; overflow: hidden; background: var(--ink-2); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; padding: 24px; box-shadow: 0 40px 80px -40px rgba(0,0,0,.7); min-width: 0; transition: transform .5s var(--ease); transform: rotate(1.5deg); }
.lp-free-card:hover{ transform: rotate(0) translateY(-4px); }
.lp-free-card header{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.lp-free-card header .eyebrow{ margin: 0; color: #9E9CB2; }
.lp-free-card-f{ position: absolute; right: -28px; bottom: -36px; width: 160px; height: 160px; pointer-events: none; }
.lp-lessons, .lp-learn{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; position: relative; z-index: 1; }
.lp-lessons li{ display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 12px 12px 10px; border-radius: 13px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); transition: background .25s, transform .3s var(--ease); }
.lp-lessons li:hover{ background: rgba(255,255,255,.08); transform: translateX(4px); }
.lp-ln{ width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(201,226,63,.14); color: var(--lime); font: 600 13px var(--f-mono); }
.lp-lt{ font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp-lessons small{ font: 500 12px var(--f-mono); color: #9E9CB2; white-space: nowrap; }
.lp-more{ margin-top: 10px; font-size: 13.5px; color: #9E9CB2; position: relative; }
.lp-learn li{ display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); font-size: 15.5px; line-height: 1.4; transition: background .25s, transform .3s var(--ease); }
.lp-learn li .ico{ color: var(--lime); flex: none; margin-top: 1px; }
.lp-learn li:hover{ background: rgba(255,255,255,.08); transform: translateX(4px); }
.lp-learn-skel{ display: grid; gap: 8px; }
.lp-learn-skel .skel{ height: 50px; border-radius: 14px; --card-2: rgba(255,255,255,.04); --line: rgba(255,255,255,.1); }

/* Benefícios (bento) */
.lp-ink{ background: var(--ink); }
.lp-ink .lp-h2{ color: #fff; }
.lp-ink .eyebrow{ color: var(--magenta); }
.lp-bento{ display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.lp-tile{ position: relative; overflow: hidden; border-radius: 24px; padding: 26px; background: var(--ink-2); border: 1px solid rgba(255,255,255,.08); display: grid; gap: 18px; align-content: space-between; min-width: 0; transition: transform .45s var(--ease), border-color .3s, background .3s; }
.lp-tile:hover{ transform: translateY(-5px); border-color: rgba(255,255,255,.18); }
.lp-tile-t{ display: grid; gap: 10px; align-content: start; }
.lp-tile-t > .ico{ color: var(--lime); }
.lp-tile h3{ font: 600 clamp(20px, 2vw, 26px)/1.12 var(--f-display); letter-spacing: -0.025em; color: #fff; max-width: 22ch; }
.lp-tile p{ color: #B9B7CB; font-size: 15px; line-height: 1.55; max-width: 46ch; }
.lp-tile-cv{ grid-column: span 4; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); align-items: center; background: linear-gradient(135deg, #2A1157 0%, #12121B 60%); }
.lp-tile-skills{ grid-column: span 2; grid-row: span 2; align-content: space-between; }
.lp-tile-goal{ grid-column: span 2; }
.lp-tile-resume{ grid-column: span 2; }
.lp-cv{ position: relative; background: #F5F4FA; border-radius: 14px; padding: 18px; display: grid; gap: 9px; transform: rotate(2deg); box-shadow: 0 30px 50px -28px rgba(0,0,0,.8); transition: transform .5s var(--ease); }
.lp-tile:hover .lp-cv{ transform: rotate(0) scale(1.02); }
.lp-cv-h{ height: 14px; width: 55%; border-radius: 99px; background: var(--ink); }
.lp-cv-l{ height: 8px; border-radius: 99px; background: #DCDAE8; }
.lp-cv-l.s{ width: 70%; }
.lp-cv-item{ display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; background: #fff; border: 1px solid #E2E0EC; color: var(--blue); animation: lpSlideIn 1s var(--ease) both; }
.lp-cv-item.a{ animation-delay: .3s; } .lp-cv-item.b{ animation-delay: .5s; color: var(--magenta-deep); }
.lp-cv-item em{ height: 8px; border-radius: 99px; background: #E4E2F0; flex: 1; }
.lp-tile:hover .lp-cv-item{ animation: cvFlash 1.1s ease both; }
.lp-blobs{ position: relative; height: 230px; }

/* Chamada final */

.lp-textlink{ color: #fff; font-weight: 600; font-size: 15px; border-bottom: 1.5px solid rgba(255,255,255,.35); padding-bottom: 2px; transition: border-color .25s, color .25s; }

/* Rodapé */

/* Tela de acesso: atalho de volta e aviso do destino */
.login-back{ justify-self: start; margin: 0 0 -6px; }
.login-intent{ margin: 0; align-items: flex-start; }
.login-intent .ico{ margin-top: 2px; }

@keyframes lpWord{ from{ transform: translateY(105%); } to{ transform: none; } }
@keyframes lpUp{ from{ opacity: 0; transform: translateY(18px); } to{ opacity: 1; transform: none; } }

@keyframes lpBreath{ from{ transform: rotate(-4deg) scale(1); } to{ transform: rotate(3deg) scale(1.04); } }

.lp-final-f{ animation-name: lpBreathY; }

/* =========================================================================
   Compra de cursos pagos: preço no catálogo, página de compra (/comprar/:id), liberação no painel
   ========================================================================= */
.price{ font: 600 17px/1 var(--f-display); letter-spacing: -0.01em; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Página de compra */
.ck{ min-height: 100vh; background: var(--paper); color: var(--ink); }
.ck-head{ position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(245,244,250,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.ck-head-in{ max-width: 1120px; margin: 0 auto; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ck-logo{ display: inline-flex; }
.ck-back{ display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--mute); font-size: 14px; font-weight: 500; padding: 8px 10px; border-radius: 9px; transition: color var(--t), background var(--t); }

.ck-grid{ max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-areas: "intro card" "details card"; column-gap: clamp(28px, 4vw, 56px); row-gap: 28px; align-items: start; }
.ck-intro{ grid-area: intro; display: grid; gap: 14px; min-width: 0; }
.ck-kicker{ color: var(--blue); margin: 0; }
.ck-cover{ border-radius: 20px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(11,11,18,.5); }
.ck-cover .art{ border-radius: 20px; }
.ck-title{ font: 600 clamp(30px, 4vw, 46px)/1.05 var(--f-display); letter-spacing: -0.03em; color: var(--ink); margin-top: 6px; }
.ck-lead{ font-size: 17px; line-height: 1.55; color: #45435A; max-width: 60ch; }
.ck-facts{ list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ck-facts li{ display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-size: 13.5px; color: #45435A; }
.ck-facts li .ico{ color: var(--blue); }
.ck-details{ grid-area: details; display: grid; gap: 14px; min-width: 0; }
.ck-details h2{ font-size: 20px; color: var(--ink); }
.ck-learn{ list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ck-learn li{ display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 15px; line-height: 1.45; color: var(--ink); }
.ck-learn li .ico{ color: var(--lime-ink); flex: none; margin-top: 1px; }
.ck-skills{ display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
.ck-skills span{ font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.ck-skills em{ font-style: normal; padding: 4px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-weight: 500; }

.ck-card{ grid-area: card; position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); background: var(--ink); color: #F3F2F8; border-radius: 24px; padding: 24px; display: grid; gap: 16px; box-shadow: 0 40px 80px -40px rgba(11,11,18,.6); animation: ckIn .55s .08s var(--ease) both; isolation: isolate; overflow: hidden; --fg: #F3F2F8; --mute: #A6A4BA; --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.18); --card: var(--ink-2); --card-2: var(--ink-3); --err-c: var(--err); --err-bg: rgba(255,107,132,.12); --warn-c: var(--warn); --warn-bg: rgba(242,169,59,.14); color-scheme: dark; }
.ck-card::before{ content: ""; position: absolute; z-index: -1; width: 260px; aspect-ratio: 181 / 254; right: -90px; top: -80px; transform: rotate(14deg); background: rgba(221,51,207,.16); -webkit-mask: var(--mark-mask) center / contain no-repeat; mask: var(--mark-mask) center / contain no-repeat; pointer-events: none; }
.ck-card-skel{ min-height: 300px; align-content: start; }
.ck-card-skel .skel{ --card-2: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); }
.ck-card-eyebrow{ margin: 0; color: var(--lime); }
.ck-sum-course{ display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
.ck-thumb{ border-radius: 12px; }
.ck-sum-course div{ display: grid; gap: 3px; min-width: 0; }
.ck-sum-course b{ font: 600 16px/1.25 var(--f-display); color: #fff; }
.ck-sum-course small{ color: #A6A4BA; font-size: 13px; }
.ck-incl{ list-style: none; margin: 0; padding: 14px 0; display: grid; gap: 10px; border-top: 1px solid rgba(255,255,255,.1); border-bottom: 1px solid rgba(255,255,255,.1); }
.ck-incl li{ display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; color: #E7E6F0; }
.ck-incl li .ico{ color: var(--lime); margin-top: 2px; }
.ck-total{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ck-total span{ font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: #A6A4BA; }
.ck-price{ font: 600 clamp(34px, 4vw, 42px)/1 var(--f-display); letter-spacing: -0.03em; color: #fff; font-variant-numeric: tabular-nums; }
.ck-cta{ height: 56px; font-size: 16px; border-radius: 14px; position: relative; overflow: hidden; transition: background var(--t), transform .2s var(--ease), box-shadow .3s var(--ease); }

.ck-fine{ font-size: 13px; color: #A6A4BA; text-align: center; line-height: 1.45; }
.ck-provider{ display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: -8px; }

@keyframes ckIn{ from{ opacity: 0; transform: translateY(16px) scale(.985); } to{ opacity: 1; transform: none; } }

@media (max-width: 860px){

  .ck-cover{ display: none; }

/* =========================================================================

   ========================================================================= */
